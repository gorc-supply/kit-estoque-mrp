<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Suba sua planilha de estoque e receba curva ABC-XYZ, parâmetros de reposição, sugestão de compras e MRP em segundos — de graça e sem seus dados saírem do computador."
    />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="author" content="Gabriel Cunha" />
    <title>Kit Estoque MRP — curva ABC-XYZ, reposição, compras e MRP grátis no navegador</title>

    <!-- Open Graph (prévia do link no LinkedIn). A og:image precisa de URL absoluta. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Kit Estoque MRP" />
    <meta property="og:title" content="Kit Estoque MRP — curva ABC-XYZ, reposição, compras e MRP" />
    <meta
      property="og:description"
      content="Suba sua planilha de estoque e receba curva ABC-XYZ, parâmetros de reposição, sugestão de compras e MRP em segundos. Grátis e sem seus dados saírem do computador."
    />
    <meta property="og:url" content="https://gorc-supply.github.io/kit-estoque-mrp/" />
    <meta
      property="og:image"
      content="https://gorc-supply.github.io/kit-estoque-mrp/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta
      property="og:image:alt"
      content="Kit Estoque MRP: curva ABC-XYZ, reposição, compras e MRP a partir da sua planilha"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kit Estoque MRP" />
    <meta
      name="twitter:description"
      content="Curva ABC-XYZ, reposição, compras e MRP a partir da sua planilha — grátis e 100% no navegador."
    />
    <meta
      name="twitter:image"
      content="https://gorc-supply.github.io/kit-estoque-mrp/og-image.png"
    />
    <script>
      // Aplica o tema antes da primeira pintura (evita piscar claro→escuro).
      // Preferência manual em localStorage; sem ela, segue o sistema.
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('kit-estoque-mrp:tema')
        } catch (e) {}
        var escuro =
          pref === 'escuro' ||
          (pref !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', escuro)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
